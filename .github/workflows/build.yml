name: Build main

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '**'  # all branches

jobs:
  build:
    strategy:
      matrix:
        configuration: [Debug, Release]
    # The runner image with Xcode 27 (27.1 is the default): the iOS and Mac Catalyst workloads need the SDK of Xcode 27.1
    runs-on: xcode-27

    steps:
      - uses: actions/checkout@v6
      - name: Setup necessary dotnet SDKs
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          dotnet-version: |
            10.x
            8.x

      - name: Build via Bash
        if: runner.os != 'Windows'
        run: |
          chmod +x ./build.sh
          ./build.sh
        env:
          CI: true
          CONFIGURATION: ${{ matrix.configuration }}
          ENABLE_COVERAGE: true
          # A Mac Catalyst app needs a provisioning profile to write to the Keychain, which the runner does not have yet,
          # so the tests that write are skipped there until the signing of CI is set up
          XHARNESS_TARGETS: ios-simulator-64,maccatalyst
          SKIP_KEYCHAIN_WRITE_TESTS: true
      - name: Build via Windows
        if: runner.os == 'Windows'
        run: ./build.cmd
        env:
          CI: true
          CONFIGURATION: ${{ matrix.configuration }}
          ENABLE_COVERAGE: true
